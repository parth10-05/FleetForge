name: Foundation verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            go:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'db/queries/**'
              - 'db/migrations/**'
              - 'sqlc.yaml'
              - 'test/**'
              - 'docs/evidence/v1-p06/**'
              - 'docs/versions/v1/**'
              - 'docs/implementation-plan/v1-p06-authenticated-api-demo.md'
              - 'docs/implementation-plan/v1-p06-acceptance-runner.md'
              - 'README.md'
              - 'Makefile'
              - '.gitleaks.toml'
              - '.github/workflows/foundation.yml'
            web:
              - 'api/**'
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/foundation.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: fleetforge_test
          POSTGRES_USER: fleetforge_test
          POSTGRES_PASSWORD: fleetforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetforge_test -d fleetforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: go.mod
      - run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 --config api/openapi/oapi-codegen.yaml api/openapi/openapi.yaml && git diff --exit-code -- internal/delivery/controlhttp/openapi_types.gen.go
      - run: CGO_ENABLED=0 go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate && git diff --exit-code -- internal/persistence/postgres/sqlcgen
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: mkdir -p test-results && go test -json ./... > test-results/go-unit.json
      - run: go test -count=1 ./test/domainmodel/... -args --rapid.checks=200
      - run: |
          set -o pipefail
          mkdir -p test-results
          go test -json -tags=postgresintegration -count=1 ./test/integration/postgres/... | tee test-results/postgres-integration.json
        env:
          FLEETFORGE_TEST_POSTGRES_DSN: postgres://fleetforge_test:fleetforge_test@localhost:5432/fleetforge_test?sslmode=disable
          FLEETFORGE_POSTGRES_EVIDENCE_DIR: ${{ runner.temp }}/fleetforge-fault-evidence
      - run: |
          set -o pipefail
          mkdir -p test-results
          mkdir -p "$RUNNER_TEMP/fleetforge-fault-evidence"
          go test -json -tags=postgresintegration -count=1 ./test/fault/... | tee test-results/fault-harness.json
        env:
          FLEETFORGE_TEST_POSTGRES_DSN: postgres://fleetforge_test:fleetforge_test@localhost:5432/fleetforge_test?sslmode=disable
          FLEETFORGE_FAULT_EVIDENCE_DIR: ${{ runner.temp }}/fleetforge-fault-evidence
      - name: Run P06 API acceptance evidence
        run: |
          set -o pipefail
          mkdir -p test-results "$RUNNER_TEMP/fleetforge-p06-evidence"
          git fetch --no-tags origin "${GITHUB_BASE_REF:-main}"
          export FLEETFORGE_P06_MERGE_BASE_SHA="$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}")"
          go test -json -tags=postgresintegration -count=1 ./test/e2e/v1demo/... | tee test-results/p06-acceptance.json
          test -f "$RUNNER_TEMP/fleetforge-p06-evidence/index.json"
        env:
          FLEETFORGE_TEST_POSTGRES_DSN: postgres://fleetforge_test:fleetforge_test@localhost:5432/fleetforge_test?sslmode=disable
          FLEETFORGE_P06_EVIDENCE_DIR: ${{ runner.temp }}/fleetforge-p06-evidence
          FLEETFORGE_P06_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm wrong PostgreSQL endpoint fails the integration gate
        run: |
          if FLEETFORGE_TEST_POSTGRES_DSN=postgres://fleetforge_test:fleetforge_test@localhost:1/fleetforge_test?sslmode=disable go test -tags=postgresintegration -count=1 ./test/integration/postgres/... -run TestDatabasePingUsesIsolatedSchema; then
            echo "integration gate accepted an invalid PostgreSQL endpoint"
            exit 1
          fi
      - run: go test -race ./...
      - run: go test -race -tags=postgresintegration -count=1 ./test/integration/postgres/...
        env:
          FLEETFORGE_TEST_POSTGRES_DSN: postgres://fleetforge_test:fleetforge_test@localhost:5432/fleetforge_test?sslmode=disable
      - run: go test ./internal/domain/inventory -run '^$' -fuzz '^FuzzSelectorCanonicalRoundTrip$' -fuzztime=10s
      - run: go test ./internal/redfish -run '^$' -fuzz '^FuzzTargetAddressKeepsAcceptedResourcesUnderServiceRoot$' -fuzztime=10s
      - run: go test ./internal/redfish -run '^$' -fuzz '^FuzzDecodeDocumentRejectsUnsafeInputWithoutPanic$' -fuzztime=10s
      - run: go test ./internal/domain/campaignplan -run '^$' -fuzz '^FuzzBuildCanonicalPlanIsStable$' -fuzztime=10s
      - run: go test ./internal/application/orchestration -run '^$' -fuzz '^FuzzDecode$' -fuzztime=10s
      - run: go build ./cmd/control-api ./cmd/orchestrator-worker ./cmd/redfish-simulator ./cmd/discovery-worker ./cmd/local-object-store ./cmd/database-readiness-check ./cmd/wakeup-worker ./cmd/wakeup-sweeper ./cmd/execution-worker ./cmd/precheck-worker ./cmd/observation-worker ./cmd/reconciliation-worker ./cmd/fleetforge-demo
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-results
          path: test-results/
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fault-harness-evidence
          path: ${{ runner.temp }}/fleetforge-fault-evidence/
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p06-acceptance-evidence
          path: ${{ runner.temp }}/fleetforge-p06-evidence/
          if-no-files-found: error

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec spectral lint --ruleset ../api/openapi/.spectral.yaml ../api/openapi/openapi.yaml
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: mkdir -p test-results && pnpm --dir web test -- --reporter=json --outputFile=../test-results/web-unit.json
      - run: pnpm --dir web build
      - run: pnpm --dir web audit --audit-level high
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-test-results
          path: test-results/web-unit.json
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
